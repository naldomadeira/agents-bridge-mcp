name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      id-token: write
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected v${VERSION}). Run 'pnpm version:bump' and re-tag." >&2
            exit 1
          fi

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - run: pnpm i
      - run: pnpm build
      - run: pnpm version:check
      - run: pnpm smoke:pack
      - run: pnpm smoke:cli

      # Trusted Publishing (OIDC): npm >= 11.5.1 authenticates through the id-token, no NPM_TOKEN.
      - run: npm install -g npm@latest
      - run: npm publish --access public

      - name: Verify the release on the npm registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
              echo "${NAME}@${VERSION} is on the registry"
              exit 0
            fi
            echo "${NAME}@${VERSION} not visible yet (attempt ${attempt}/5)"
            sleep 15
          done
          echo "${NAME}@${VERSION} never appeared on the registry" >&2
          exit 1
